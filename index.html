<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Boo Subin</title>
  <meta name="description" content="Performance Designer">

  <!-- 파비콘 (브라우저 탭·홈 화면 아이콘) -->
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#141414">

  <!-- 링크 미리보기 (카카오톡·메일·메신저 등에 주소를 붙였을 때) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://boosubin.github.io/">
  <meta property="og:title" content="Boo Subin">
  <meta property="og:description" content="Performance Designer">
  <meta property="og:image" content="https://boosubin.github.io/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="fonts/SUIT-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Inter-Variable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/works.js" defer></script>
  <script src="js/gallery.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1 class="site-name">BOO SUBIN</h1>
    <div class="hero">
      <span class="hero__label">(Performance Designer)</span>
      <p class="hero__text">Design that earns the <a class="hero__accent" href="#works">click</a>.</p>
    </div>
    <!-- 숫자 줄: js/gallery.js가 작업 목록을 세어서 채운다 -->
    <ul class="stats" data-stats></ul>
  </header>

  <main class="archive" id="works">
    <nav class="filter" aria-label="카테고리" data-filter-list></nav>
    <ul class="grid" data-grid></ul>
  </main>

  <!-- 작업 크게 보기 창 -->
  <dialog class="viewer" data-viewer aria-labelledby="viewer-title">
    <button class="viewer__close" type="button" data-viewer-close aria-label="닫기">✕</button>
    <!-- 창이 열릴 때 닫기 버튼 대신 이 묶음에 포커스가 가도록 (닫기 버튼에 파란 테두리가 생기지 않게) -->
    <div class="viewer__inner" tabindex="-1" autofocus>
      <header class="viewer__head">
        <h2 class="viewer__title" id="viewer-title" data-viewer-title></h2>
        <p class="viewer__tags" data-viewer-tags></p>
      </header>
      <dl class="viewer__meta" data-viewer-meta></dl>
      <div class="viewer__body" data-viewer-body></div>
    </div>
  </dialog>
</body>
</html>
